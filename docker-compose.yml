services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: subledger
      POSTGRES_USER: subledger
      POSTGRES_PASSWORD: subledger
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subledger -d subledger"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: subledger
      POSTGRES_USER: subledger
      POSTGRES_PASSWORD: subledger
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
